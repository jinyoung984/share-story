name: Deploy fe to Azure Static Web Apps

on:
  push:
    branches:
      - dev
    paths:
      - 'fe/**'
      - '.github/workflows/fe.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Build
        working-directory: fe
        env:
          VITE_API_BASE_URL: ${{ secrets.SS_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_OCEAN_0FE40FE00 }}
          action: upload
          app_location: 'fe/dist'
          skip_app_build: true
          output_location: ''
